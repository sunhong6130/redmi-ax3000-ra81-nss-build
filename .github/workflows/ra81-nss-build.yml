name: Build Redmi AX3000 RA81 NSS (小分区/双分区)

# 基于 sunhong6130/immortalwrt-x86-build 的编译环境风格改造
# 只手动触发，避免 push 时与 x86 编译任务同时运行抢占 runner
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison gawk g++ \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync swig unzip wget \
            zlib1g-dev file ccache libelf-dev

      - name: Clone NSS source (Cathgao custom branch)
        run: |
          git clone --depth 1 --branch custom https://github.com/Cathgao/openwrt-nss-edma.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds list -r nss | grep -q qca-nss-drv
          echo "NSS feed OK"

      - name: Write RA81 config (profile xiaomi_cr8806 = 原厂双分区/小分区)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_xiaomi_cr8806=y

          CONFIG_PACKAGE_nss-tools-dwmac=y
          CONFIG_PACKAGE_nss-firmware=y
          CONFIG_NSS_FIRMWARE_VERSION_12_5=y
          CONFIG_NSS_MEM_PROFILE_LOW=y
          CONFIG_NSS_DRV_VLAN_ENABLE=y
          CONFIG_NSS_DRV_IPV6_ENABLE=y
          CONFIG_NSS_DRV_VIRT_IF_ENABLE=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-pppoe=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-netlink=y
          CONFIG_PACKAGE_nssinfo=y
          CONFIG_PACKAGE_libnl-nss=y

          CONFIG_PACKAGE_MAC80211_NSS_SUPPORT=y
          CONFIG_ATH11K_NSS_SUPPORT=y
          CONFIG_ATH11K_MEM_PROFILE_256M=y
          CONFIG_NSS_DRV_WIFIOFFLOAD_ENABLE=y
          CONFIG_NSS_DRV_WIFI_EXT_VDEV_ENABLE=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y
          CONFIG_PACKAGE_ipq-wifi-xiaomi_cr8806=y

          CONFIG_NSS_DRV_SHAPER_ENABLE=y
          CONFIG_NSS_DRV_IGS_ENABLE=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-qdisc=y
          CONFIG_PACKAGE_kmod-qca-nss-drv-igs=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_sqm-scripts-nss=y
          CONFIG_PACKAGE_tc-full=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iperf3=y
          EOF

          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-ra81-init <<'EOF'
          #!/bin/sh
          uci set luci.main.lang='zh-cn'
          uci commit luci
          uci set wireless.radio0.country='CN'
          uci set wireless.radio1.country='CN'
          uci set wireless.radio1.channel='36'
          uci set wireless.radio1.htmode='HE160'
          uci commit wireless
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-ra81-init

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) download || make -j1 download
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h

      - name: Verify profile (must be xiaomi_cr8806, NOT ubootmod)
        run: |
          cd openwrt
          echo "===== 产物列表 ====="
          ls -lh bin/targets/qualcommax/ipq50xx/
          echo "===== 校验 ====="
          ls bin/targets/qualcommax/ipq50xx/*xiaomi_cr8806*squashfs-sysupgrade.bin
          if ls bin/targets/qualcommax/ipq50xx/ | grep -q ubootmod; then
            echo "ERROR: 出现了 ubootmod(大分区)镜像，profile 选错了！" && exit 1
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ra81-nss-xiaomi-cr8806-run${{ github.run_number }}
          path: |
            openwrt/bin/targets/qualcommax/ipq50xx/*xiaomi_cr8806*squashfs-sysupgrade.bin
            openwrt/bin/targets/qualcommax/ipq50xx/sha256sums
          if-no-files-found: error
